name: Build APK from zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Unzip uploaded source
        run: |
          mkdir -p src
          unzip -q ./*.zip -d src
          ls src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 28
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;28.0.3"

      - name: Remove preinstalled NDK
        run: |
          rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/ndk-bundle"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Replace jcenter with mavenCentral
        working-directory: src/added-pixel-dungeon-0.7.4d
        run: |
          sed -i 's/jcenter()/mavenCentral()/g' build.gradle */build.gradle

      - name: Build debug APK
        working-directory: src/added-pixel-dungeon-0.7.4d
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK_LATEST_HOME: ""
          ANDROID_NDK: ""
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: added-pixel-dungeon-apk-from-zip
          path: src/added-pixel-dungeon-0.7.4d/android/build/outputs/apk/debug/*.apk
